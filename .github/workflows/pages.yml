# Publishes the documentation to docs.shurobotics.com.
#
# Publishes from `main` deliberately. `main` is the squash-merge of the release
# branch with docs/internal/ dropped, so the development record cannot reach
# the public site by construction rather than by configuration. The working
# branch is NOT published: it contains docs/internal/, and a nav-list exclusion
# is a weaker guarantee than a branch that never had the files.
#
# Consequence worth knowing: the site lags the working branch. It updates when
# a release squashes to main, not when a chunk lands.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'tools/prepare_site.py'
      - 'tools/api_doc_tool.py'
      - '.github/workflows/pages.yml'
      # the route builder (RMP1-A1): its own files, and everything its baked robots and its checks come from
      - 'tools/route_maker/**'
      - 'include/**'
      - 'src/robots/**'
      - 'src/team/*_driver.hpp'   # RMP1-B: the Controls tab bakes each robot's driver file,
      - 'src/programs/drive_program.cpp'   # and whether its programs take a feel other than the default
      - 'test/**'
  workflow_dispatch:

# Allow one publish at a time; let a newer commit supersede an in-flight run
# rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # PINNED to ubuntu-24.04 (chunk RMP1-A1, the RMP1 brief W14), as ci.yml's jobs are: this job now builds the
    # route builder's native describe program with GCC and -Werror, and 'ubuntu-latest' is GCC 15.2 -- the
    # trap that kept CI red from mid-October to 2026-11-13. The site is built with the compiler the gates use.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── THE RULE THAT MUST NOT BE REMOVED ────────────────────────────────
      # Publishing a stale reference is worse than publishing none, because a
      # published document looks authoritative. The whole point of generating
      # the API reference is that it cannot drift from the headers — a publish
      # step that ships whatever happens to be committed, unchecked, gives
      # that guarantee away at the last possible moment.
      #
      # The host build enforces this too, but the host build does not run here,
      # and "it was checked somewhere else" is how a gate quietly stops being
      # a gate.
      - name: The committed API reference matches the headers
        run: python3 tools/api_doc_tool.py check-fresh

      # Rewrites the links that point into the source tree (correct in-repo,
      # 404 on a site), and REFUSES to build if any internal development doc
      # would be published. See tools/prepare_site.py.
      - name: Prepare the site source
        run: python3 tools/prepare_site.py site_src

      # THE ROUTE BUILDER (chunk RMP1-A1; the RMP1 brief A.3.5): built from THIS commit -- the robots it knows are
      # this commit's tables (`shulib_route_maker describe`, the suite's flags) -- into site_src/route-builder/, so
      # `mkdocs build` copies it as static files beside the docs page docs/route-builder.md renders to
      # route-builder/index.html. The app is route-builder/app.html, NEVER index.html (mkdocs would overwrite it,
      # silently: W3). tools/route_maker/build.py refuses a URL other than the XML namespaces and any laptop or
      # runner path (RG1) in what it writes.
      - name: Install host toolchain (the route builder's describe program)
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Build the route builder into the site
        run: |
          cmake -S test -B build/test
          cmake --build build/test --target shulib_route_maker -j4
          python3 tools/route_maker/build.py --out site_src/route-builder --describe build/test/shulib_route_maker

      - name: Install the renderer
        run: pip install mkdocs==1.6.1 mkdocs-material==9.5.44

      # strict: true in mkdocs.yml — a dead link fails the build rather than
      # shipping.
      - name: Build
        run: mkdocs build --strict

      # The custom domain. For an Actions-based Pages deploy the authoritative
      # setting is Settings > Pages > Custom domain — this file does not
      # replace it. It is written here, into the ARTIFACT, rather than kept in
      # docs/, because docs/ is a documentation source tree and a bare hostname
      # file is not documentation: it would show up when browsing the docs on
      # GitHub, and prepare_site.py would carry it around as if it were content.
      # Emitting it at build time keeps the intent recorded in the repo without
      # putting a non-document in the document directory.
      - name: Custom domain
        run: echo 'docs.shurobotics.com' > site/CNAME

      # PG1 (the RMP1 brief W3): AFTER mkdocs -- the only step that can see a collision, because the browser tests in
      # ci.yml test build.py's output, never the mkdocs-built site.
      - name: The route builder survived the docs build (PG1)
        run: |
          test -f site/route-builder/app.html || { echo "::error::site/route-builder/app.html is missing"; exit 1; }
          test -f site/route-builder/shulib-route-builder.html || { echo "::error::the one-file download is missing"; exit 1; }
          grep -q '<meta name="shulib-app" content="route-builder">' site/route-builder/app.html \
            || { echo "::error::site/route-builder/app.html is not the route builder (overwritten by a rendered page?)"; exit 1; }
          grep -q 'route-builder/app.html\|href="app.html"' site/route-builder/index.html \
            || { echo "::error::the Route builder docs page does not link the app"; exit 1; }
          # "Download for offline use" must SAVE the one file (a plain link only opens it online)
          grep -q 'href="shulib-route-builder.html"[^>]*download="shulib-route-builder.html"\|download="shulib-route-builder.html"[^>]*href="shulib-route-builder.html"' site/route-builder/index.html \
            || { echo "::error::the docs page's 'Download for offline use' link has no download attribute"; exit 1; }
          if grep -rl -a -E '/home/|/Users/|C:\\|/runner/|\.claude' site/route-builder ; then
            echo "::error::the route builder carries a laptop's or a runner's path (RG1)"; exit 1
          fi
          echo "the route builder is in the site: app.html, the one file, the docs page links it"

      # Belt-and-braces after rendering: prove no internal path survived into
      # the built HTML. prepare_site.py checks the markdown; this checks the
      # artifact that actually ships.
      - name: The built site contains no internal documentation
        run: |
          if grep -rlE 'docs/internal|-COMPLETED\.md|-PROGRESS\.md|build-order' site/ ; then
            echo "::error::internal development docs reached the built site"
            exit 1
          fi
          echo "built site is free of internal documentation"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
