name: ci

# Host-side verification of the PROS-free core, plus the ARM gate.
# Runs the same checks we run locally: the architecture guards, the strict host
# build, the test suite, (since chunk MECH-A1) the compile-refusal harness — every
# build-time refusal of the mechanism core a robot file can reach must fail to
# compile, naming its reason —,
# (since chunk A4) a cross-COMPILE of every v2 header for
# the V5's Cortex-A9, and (since chunk GATE1) the REAL on-robot BUILD — compile
# AND link, every build (seven since T4 Part 3 retired the tank library program:
# three robot variants and the tank drive/calibrate/autontest/competition
# programs) — of src/ under a warning policy.
# (This file said the ARM link was impossible in CI until 2026-08-19 — "needs
#  PROS's bundled toolchain". MEASURED FALSE at GATE1: the firmware archives are
#  vendored in-tree and `make` links end to end at apt's arm-none-eabi-g++ 13.2.1
#  with the Makefile's CXX_STANDARD:=gnu++20 pin. Do not re-derive the old
#  blocker. What remains intentionally NOT in CI is only the on-robot RUN —
#  uploading and executing needs the robot itself, chunks R3a/R3b/R3c.)

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # python3 is REQUIRED by the host test build, not optional: it runs the
      # documentation gates (tools/api_doc_tool.py) that fail the build when a
      # public member is undocumented, when the generated reference in docs/api/
      # is stale, when a documented example has drifted from the compiled test
      # that proves it, or when a public document links into docs/internal/.
      # Before chunk D3 the last two lived only in an internal verify script, so
      # a rotted example passed CI; mutation found that, and this is the fix.
      - name: Install host toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3

      # ARCHITECTURE GUARD: the library must never include <pros/*>. That
      # PROS-freeness is exactly what makes it host-testable. Scope = ALL of
      # include/shulib/ (broadened at the C7 legacy cutover, 2026-08-10, when
      # the old PROS-coupled code was deleted), EXCEPT the one path that exists
      # to include PROS: include/shulib/hal/pros/, the adapter tree (chunk
      # R1a). The exemption is PATH-ANCHORED (a prefix match on the exact
      # directory), NOT --exclude-dir=pros: the name-based form was MEASURED
      # missing a violation planted at include/shulib/localization/pros/ —
      # any directory named "pros", anywhere, would have been exempt (D3: "a
      # gate's exclusion list is where its holes live"; brief M8/M9).
      # src/ remains the other deliberate exception: it lives outside include/shulib/
      # — main.cpp, the PROS entry points, and the programs under src/programs/ and
      # src/common/ (SRC1's layout, 2026-09-27) — and wires the PROS-free core to them.
      # This grep says NOTHING about src/: the auton tester's pure headers
      # (src/programs/auton_abort_watch.hpp, auton_tester_run.hpp, auton_tester_panel.hpp)
      # and the team's src/team/autons.{hpp,cpp} are held PROS-free by a source pin in
      # the host suite instead (test/auton_tester_source_test.cpp, COMP-t) — the host
      # shim provides pros/rtos.hpp and pros/misc.hpp, so a compile could not tell.
      - name: No <pros/> in the library (except hal/pros, path-anchored)
        run: |
          if grep -rnE '#[[:space:]]*include[[:space:]]*[<"]pros/' include/shulib \
               | grep -v '^include/shulib/hal/pros/'; then
            echo "::error::include/shulib must stay PROS-free outside hal/pros/ (no #include <pros/...> / \"pros/...\")"
            exit 1
          fi
          echo "library is PROS-free (all of include/shulib except hal/pros/)"

      # LAYERING GUARD (chunk A2, constraint 3): ground truth must never be reachable
      # from an estimator. shulib/sim/ (the host plant) may include the core; the core
      # may NEVER include shulib/sim/ — so code under test can only ever see the
      # synthesized fakes, and truth stays a harness/assertion-only quantity.
      # Scope = all of include/shulib/ EXCEPT sim/ itself (--exclude-dir), so a
      # new core directory is covered the moment it exists — an enumerated list
      # rots (broadened alongside the PROS guard at the C7 cutover).
      - name: Core never includes the sim plant
        run: |
          if grep -rnE --exclude-dir=sim '#[[:space:]]*include[[:space:]]*[<"]shulib/sim/' \
               include/shulib; then
            echo "::error::the core must not depend on shulib/sim (ground truth would become reachable from estimators)"
            exit 1
          fi
          echo "layering holds: core is sim-free"

      # DOCUMENTATION GATES (chunk D3). Run explicitly as well as via the build,
      # so a failure names itself in the CI log instead of appearing as "build
      # failed" three hundred lines into a compile.
      - name: Documentation gates (coverage, freshness, examples, removability, briefing, staleness)
        run: |
          python3 tools/api_doc_tool.py self-test
          python3 tools/api_doc_tool.py check-coverage
          python3 tools/api_doc_tool.py check-fresh
          python3 tools/api_doc_tool.py check-examples
          python3 tools/api_doc_tool.py check-removability
          python3 tools/briefing_status.py self-test
          python3 tools/briefing_status.py check
          python3 tools/doc_staleness_audit.py self-test
          python3 tools/doc_staleness_audit.py

      - name: Configure (host tests)
        run: cmake -S test -B build/test

      - name: Build (strict -Werror)
        run: cmake --build build/test

      - name: Run tests
        run: ./build/test/shulib_tests

      # THE COMPILE-REFUSAL HARNESS (chunk MECH-A1, 2026-10-08; the MECH brief's §3.0). The
      # mechanism core refuses a robot file's mistakes AT BUILD, each by name; a refusal no test can
      # see is one a mutation can delete. Every one a robot file can reach (all but the two "used
      # twice" fallbacks in mechanism/wiring.hpp, which no list can) has a translation unit in
      # test/compile_refusals/ that must FAIL to compile and name its reason
      # (test/compile_refusals/run_refusal.py judges it, matching the reason in a diagnostic's
      # MESSAGE, never a path); four self-tests prove the judge cannot be fooled (a TU that
      # compiles, the wrong reason, the reason only in a file name, the wrong line). The TUs are
      # EXCLUDE_FROM_ALL object targets, so the build above never compiles them — this step does,
      # one at a time (they share a lock on the build tree).
      # A DETACHED harness must not pass (MECH-A1's review): with no test matching, ctest prints "No
      # tests were found!!!" and exits 0 — so --no-tests=error, and the number of compile_refusal
      # CTests must EQUAL the number of TUs in test/compile_refusals/ (a dropped add_subdirectory, a
      # broken glob or a renamed test all fail here).
      - name: Compile refusals (every build-time refusal names its reason)
        run: |
          ctest --test-dir build/test -R compile_refusal --no-tests=error --output-on-failure
          tus=$(ls test/compile_refusals/*.cpp | wc -l)
          tests=$(ctest --test-dir build/test -N -R compile_refusal | sed -n 's/^Total Tests: //p')
          echo "compile-refusal TUs: $tus; their CTests: $tests"
          test "$tests" -eq "$tus"

  # ARM GATE (chunk A4: every v2 header; widened at chunk GATE1: the real src/
  # build). The v2 core was verified to cross-compile clean for the V5's Cortex-A9
  # at every chunk since A1 — but only by hand, so nothing KEPT it that way: a
  # host-only construct (a header, an intrinsic, a hosted-only std facility) could
  # enter the core unnoticed and surface on the robot, where it is expensive. This
  # job holds the line. (The job NAME predates GATE1 and is kept stable.)
  #
  # Scope, stated honestly, in two layers:
  #  * The HEADER step below is a COMPILE gate: every header under include/shulib/
  #    as one TU, strict flags + -Werror, at the exact -std/-mcpu/-mfpu/-mfloat-abi
  #    the V5 uses. The header list is GENERATED (find | sort), never hard-coded —
  #    a gate you must remember to update when adding a file is a gate that rots.
  #  * The SRC BUILD GATE steps (GATE1) run the REAL `make` — compile AND LINK,
  #    producing bin/hot.package.bin — for EVERY build (ROBOT=bench, ROBOT=xdrive,
  #    since R3b Session 2 ROBOT=tank, and since R3b Part 0b the second axis
  #    ROBOT=tank PROGRAM=drive, since R3d Part 2 ROBOT=tank PROGRAM=calibrate,
  #    since COMP-t ROBOT=tank PROGRAM=autontest, and since COMP-b ROBOT=tank
  #    PROGRAM=competition — seven builds since T4 Part 3, which RETIRED ROBOT=tank
  #    PROGRAM=library (the tool keeps it retired; it owns the list),
  #    because until GATE1 src/ was in NO gate at all and the
  #    Makefile records that this blind spot shipped a data abort to the robot.
  #    Until 2026-08-19 this comment's ancestor claimed the link needed PROS's
  #    bundled toolchain; measured false — firmware/*.a are vendored in-tree and
  #    apt's gcc-arm-none-eabi (13.2.1) links it, with Makefile's gnu++20 pin.
  #    The warning policy (no category allowed since G1 Part 2c's final run:
  #    every warning in our code fails) and the self-test live in
  #    tools/src_build_gate.py's header. A missing toolchain FAILS; never skips.
  #  What is still NOT here: uploading to or running on a brain (chunks R3a/R3b/R3c).
  arm-compile-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

      - name: Cross-compile every v2 header for the V5 (Cortex-A9, softfp)
        run: |
          find include/shulib -name '*.hpp' | sed 's|^include/||' | LC_ALL=C sort \
            | awk '{print "#include \""$0"\""}' > all_headers.cpp
          echo 'int main() { return 0; }' >> all_headers.cpp
          echo "TU includes $(grep -c '#include' all_headers.cpp) headers"
          arm-none-eabi-g++ -std=gnu++20 -Wall -Wextra -Wconversion -Wsign-conversion \
            -Wshadow -Werror -Os -mcpu=cortex-a9 -mfpu=neon-fp16 -mfloat-abi=softfp \
            -c all_headers.cpp -o /dev/null -Iinclude
          echo "ARM compile gate: CLEAN (all v2 headers)"

      # SRC BUILD GATE (chunk GATE1) — one command, identical to what is run
      # locally. The self-test runs FIRST and proves the detectors can fire by
      # planting real faults (a syntax error, a disallowed warning, a new dead
      # function — -Wunused-function, a FAILURE since G1 Part 2c's final run — a
      # vendor-path warning, a dropped or look-alike variant define, and — since
      # G1 Part 2c, which retired the warning-count differential — a broken
      # branch of src/build_selection.hpp's one #if chain, an unhandled program
      # or robot, a build switch read anywhere else (each table, a library
      # header, a host test, a .c++ or .S file and the host build's CMake
      # included) in every directive form, a selection name made a macro, a
      # program naming ANOTHER robot's table, a second chain, an entry point
      # calling another program's function, a branch assigning the wrong
      # program or the wrong ROBOT, the robot split into a chain of its own, a
      # program the gate's table does not know, and — since SRC1 — a switch or
      # another robot's table in each of src/'s folders, a header a second
      # include root would answer instead of src/'s, an include not written
      # from src/, an old-form include that must not build, and a src/ path a
      # program prints that names no file) and building
      # each where a build is what sees it; then check runs the gate itself. Both builds are
      # forced fresh (bin/ and .d/ deleted) and the compiled-TU count is printed
      # and verified, so an incremental no-op can never report green silently.
      - name: src build gate self-test (prove the detectors fire)
        run: python3 tools/src_build_gate.py self-test

      - name: Build src/ for the V5 (real link, every variant, warning policy)
        run: python3 tools/src_build_gate.py check
