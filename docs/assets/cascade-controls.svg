<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The controller map of both robots' driver files">
<title>Both robots' controls (the builder, 2026-11-15): left stick drives, right stick turns; R1 / R2 held move the cascade up / down; A the claw, B the front toggle, X the ramp; L1 held runs the right side toggle, L2 the left; Y is the field-centric re-zero (off); the d-pad is free.</title>
