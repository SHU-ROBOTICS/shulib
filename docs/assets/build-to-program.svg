<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 458" width="540" height="458" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="One build, one program">
<title>One build, one program: make ROBOT=one PROGRAM=autontest; then src/build_selection.hpp; then src/main.cpp; then src/programs/auton_tester_program.cpp; then src/team/robot_one_autons.cpp + src/team/skills_route.cpp</title>
<defs><marker id="bp" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#3f51b5"/></marker></defs>
<rect width="540" height="458" fill="#ffffff"/>
<text x="270" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a237e">One build, one program</text>
<rect x="12" y="48" width="516" height="58" rx="10" fill="#e8eaf6" stroke="#3f51b5"/>
<text x="28" y="73" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111111">make ROBOT=one PROGRAM=autontest</text>
<text x="28" y="92" font-size="13" fill="#3f51b5">you type this</text>
<line x1="270" y1="108" x2="270" y2="130" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#bp)"/>
<rect x="12" y="132" width="516" height="58" rx="10" fill="#eceff1" stroke="#607d8b"/>
<text x="28" y="157" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111111">src/build_selection.hpp</text>
<text x="28" y="176" font-size="13" fill="#607d8b">turns make ROBOT=… PROGRAM=… into one program on one robot</text>
<line x1="270" y1="192" x2="270" y2="214" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#bp)"/>
<rect x="12" y="216" width="516" height="58" rx="10" fill="#eceff1" stroke="#607d8b"/>
<text x="28" y="241" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111111">src/main.cpp</text>
<text x="28" y="260" font-size="13" fill="#607d8b">hands PROS's five entry points to that program</text>
<line x1="270" y1="276" x2="270" y2="298" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#bp)"/>
<rect x="12" y="300" width="516" height="58" rx="10" fill="#eceff1" stroke="#607d8b"/>
<text x="28" y="325" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111111">src/programs/auton_tester_program.cpp</text>
<text x="28" y="344" font-size="13" fill="#607d8b">shulib Auton Tester, slot 6</text>
<line x1="270" y1="360" x2="270" y2="382" stroke="#3f51b5" stroke-width="2.5" marker-end="url(#bp)"/>
<rect x="12" y="384" width="516" height="58" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
<text x="28" y="409" font-size="14" font-family="Menlo, Consolas, monospace" fill="#111111">src/team/robot_one_autons.cpp + src/team/skills_route.cpp</text>
<text x="28" y="428" font-size="13" fill="#2e7d32">your code</text>
</svg>
