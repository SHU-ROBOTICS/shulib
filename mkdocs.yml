# Static-site configuration for docs.shurobotics.com.
#
# The site is built from a PREPARED COPY of docs/, not from docs/ directly:
# tools/prepare_site.py rewrites the 117 links that point into the source tree
# (correct when GitHub renders the markdown in-repo, 404 on a rendered site)
# into absolute GitHub URLs, and refuses to proceed if any internal
# development doc would be published. See .github/workflows/pages.yml.
#
# Published from `main`, which does not contain docs/internal/ at all — the
# exclusion below is belt-and-braces for the case where someone builds this
# locally from the working branch.

site_name: shulib
site_description: >-
  A holonomic-native autonomous library for VEX U robots, built by the
  Seton Hall University robotics team.
site_url: https://docs.shurobotics.com/
repo_url: https://github.com/SHU-ROBOTICS/shulib
repo_name: SHU-ROBOTICS/shulib
edit_uri: ""            # docs are edited in-repo; an "edit" pencil on a
                        # GENERATED api page would invite editing the wrong file

docs_dir: site_src      # produced by tools/prepare_site.py — never docs/ directly

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  # NAVIGATION (chunks DOCS2, DOCS3). The tabs are a reader's TASKS (Robot, Routes,
  # Mechanisms, Troubleshoot, Learn, API reference, Project), so the sidebar only ever shows
  # one task's pages. Page FILES keep their chapter numbers (tests, links and bookmarks use
  # them); the menu shows titles only. tools/doc_readability.py check-nav fails the build if
  # a public page is missing from the menu, listed twice, or a menu line names no file.
  #   navigation.indexes — a section's first, bare entry is its landing page.
  #   (no navigation.sections) — only the group you are reading is open.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - search.share
    - toc.follow

markdown_extensions:
  - admonition
  # GitHub-compatible heading slugs. The docs are read in two places, and every
  # hand-written cross-document anchor was authored against GitHub's algorithm
  # (`## 17. Accessibility & Progressive…` -> `#17-accessibility--progressive…`,
  # with the doubled dash where the ampersand was). mkdocs' default slugifier
  # produces a different string, which silently turns six existing links into
  # jumps to the top of the page — the degraded-but-not-obviously-broken failure
  # that is worst in documentation. This is the same problem D3 solved for the
  # generated reference by emitting explicit anchors; here the fix is to make
  # the renderer agree with the links that already exist.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - tables
  - attr_list
  # A generated API page ends with the header's full design commentary — the
  # "why", which is the most valuable prose in this project and also, on the
  # longest headers, two hundred lines of it. It is wrapped in a plain
  # <details> element so it folds: long ones start closed, short ones start
  # open. Plain HTML rather than a Material admonition on purpose — these
  # documents are read on GitHub as well as on the site, and `??? note`
  # renders as literal question marks there.
  - md_in_html

plugins:
  - search

# Fail the build on a bad link rather than publishing one. The docs are
# checked mechanically in CI for exactly this reason; the site must not be
# the one place where a dead link is tolerated.
strict: true
validation:
  links:
    absolute_links: ignore      # rewritten source links are absolute by design
    unrecognized_links: warn
    anchors: warn               # a link to a missing #anchor fails the strict build

exclude_docs: |
  internal/

nav:
  - Home: index.md

  # The menu by task (DOCS3). "Start here" (the beginner track) and "Route builder" join
  # as their pages land; check-nav keeps every public page in the menu exactly once.
  # The route builder (chunk RMP1-A1): its page, beside which pages.yml builds the app itself
  # (route-builder/app.html and the one-file download -- never route-builder/index.html, which this page renders to).
  - Route builder:
      - route-builder.md
      - Make your first route: guide/22-making-your-first-route.md
  - Robot:
      - Set up:
          - Build and upload the programs: guide/07-getting-set-up.md
          - Where your code goes: where-your-code-goes.md
          - Add your robot: guide/21-adding-your-robot-by-hand.md
          - The robot facts form: robot-facts-form.md
          - Calibrate the drive: guide/19-calibrating-your-robot.md
      - Drive and compete:
          - Buttons for your mechanisms: cookbook/06-driver-control.md
          - Match day — the competition program: guide/17-the-competition-program.md
